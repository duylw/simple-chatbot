[project]
name = "temporal-rag-qa-system"
version = "2.0.0"
description = "Clean Architecture Temporal RAG QA System for Academic Lecture Videos"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "sqlalchemy>=2.0.48",
    "asyncpg>=0.31.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.5.1",
    "langchain-chroma>=1.1.0",
    "onnxruntime>=1.24.4",
    "rank-bm25>=0.2.2",
    "langfuse>=4.2.0",
    "passlib>=1.7.4",
    "bcrypt<4.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.9",
    "httpx>=0.28.0",
]

[dependency-groups]
gradio = [
    "gradio>=6.11.0",
    "pandas>=2.0.0",
]
# Dependencies for development and testing
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
