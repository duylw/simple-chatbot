name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Pytest Suite with Coverage
        env:
          GOOGLE_API_KEY: "AIzaSyMockKeyForCIPipelineTestingOnly12345"
          GROQ_API_KEY: "gsk_mock_key_for_ci_pipeline_testing"
          OPENROUTER_API_KEY: "sk-or-v1-mock_key_for_ci"
          OPENAI_API_KEY: "sk-mock_key_for_ci"
          SECRET_KEY: "ci-secret-key-for-jwt-signing"
          ENVIRONMENT: "development"
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
